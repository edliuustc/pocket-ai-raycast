name: Windows checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Restore dependencies
        run: npm.cmd ci --no-audit --no-fund
      - name: TypeScript
        run: npm.cmd run typecheck
      - name: Lint
        run: npm.cmd run lint
      - name: Formatting
        run: npm.cmd run format:check
      - name: Unit tests
        run: npm.cmd test
      - name: Installer checks
        run: npm.cmd run test:installer
      - name: Isolated production build
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\install.ps1 -BuildOnly -SkipDependencies
      - name: Source release package
        run: npm.cmd run package:windows
